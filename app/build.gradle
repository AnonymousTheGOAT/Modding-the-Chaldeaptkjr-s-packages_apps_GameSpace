import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "io.chaldeaprjkt.gamespace"
        minSdk 33
        targetSdk 33
        versionCode 100
        versionName "0.2"
    }

    signingConfigs {
        debug {
            storeFile file("$rootDir/debug-keystore.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            def releaseStorePath = System.getenv("RELEASE_STORE_FILE")
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
            } else {
                storeFile file("$rootDir/release-keystore.jks")
            }

            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "releasekey"
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
            minifyEnabled false
        }

        release {
            debuggable true
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions.jvmTarget = JvmTarget.JVM_1_8
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/java']
        }
    }

    lint {
        disable 'ContentDescription', 'QueryAllPackagesPermission', 'ProtectedPermissions', 'OldTargetApi', 'UseCompatLoadingForDrawables', 'UnsafeProtectedBroadcastReceiver'
    }
}

dependencies {
    compileOnly files(frameworkJar)
    implementation(name: 'settingslib', ext: 'aar')
    implementation(name: 'settingslib-utils', ext: 'aar')
    implementation(name: 'settingslib-widget', ext: 'aar')

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.dagger:hilt-android:2.45'
    kapt 'com.google.dagger:hilt-compiler:2.45'
    implementation 'com.airbnb.android:lottie:6.0.0'
}

kapt {
    correctErrorTypes true
}
